########################################################################
# PptxSweeper pipeline configuration.
# Never hardcode paths/thresholds/secrets in code -- everything tunable
# lives here. Secrets (contact email) live in .env, never in this file.
########################################################################

# Only these formats are ever queued, downloaded, or delivered.
# Enforced in three places: URL filter, download (magic bytes), classify.
# pdf added for image delivery (graphical pages extracted from PDF reports
# as well as decks).
allowed_formats: ["pptx", "ppt", "pdf"]

contact_email_env: CONTACT_EMAIL
user_agent_template: "PptxSweeperBot/1.0 (dataset research; {contact_email})"

paths:
  data_dir: ./data
  db_path: ./data/registry.db
  download_tmp_dir: ./data/tmp_downloads
  staging_dir: ./data/staging
  review_dir: ./data/review
  pages_dir: ./data/pages
  logs_dir: ./data/logs
  seeds_dir: ./seeds
  status_dir: ./data/status
  batch_build_dir: ./data/batch_build
  manifests_dir: ./data/manifests

rclone:
  bin: rclone
  remote_name: gdrive
  root_folder: PptxSweeper_Delivery
  batch_folder_pattern: "BATCH_{batch_id}"
  review_folder: _review
  status_folder: _status
  backups_folder: registry_backups
  verify_method: size-only   # size-only | hash
  # Wall-clock cap on a single rclone call (seconds). A stalled Google
  # Drive connection (the recurring "upload silently stops" hang) must not
  # be able to block the deliver loop for the old 3600s default * retries.
  timeout_s: 900
  # Tighter, single-attempt budget for the best-effort review/ -> _review/
  # sync, which re-runs every classify pass: a fast failure (keep local
  # payloads, retry next pass) is strictly better than a long stall.
  review_sync_timeout_s: 300

batch:
  size: 25000
  # padding starts at 2 digits, grows to 3 automatically once batch_id > 99
  min_padding: 2
  # CLIENT CONTRACT: >=70% HIGH, 20-30% MEDIUM, 0% LOW per batch. These are
  # enforced by both the full-batch selector (compose.select_for_batch) and
  # the streaming path (ratio-based MEDIUM reservation). The packager also
  # refuses to run with a degenerate config (high_min_pct < 0.5 or
  # medium_max_pct > 0.4) and falls back to the contract defaults.
  composition:
    high_min_pct: 0.70
    medium_min_pct: 0.20
    medium_max_pct: 0.30
    low_max_pct: 0.0
    # a batch is allowed to open with fewer than batch.size files only
    # when reserve+deliverable HIGH supply is provably insufficient AND
    # a max_open_days ceiling is hit (see packager DECISIONS.md entry)
    max_batch_open_days: 14

upload:
  daily_byte_budget_gb: 700       # margin under Google's 750GB/day cap
  max_retries: 5
  retry_backoff_s: [10, 30, 120, 300, 900]

disk:
  # OS-level backstop: the orchestrator refuses to start ANY stage
  # (download/classify/package) when free disk on the data dir falls
  # below this. The download stage has its own finer guard
  # (download.min_free_disk_gb); this one protects the WHOLE box from
  # the unguarded consumers -- staging/, batch_build/, review/, logs --
  # so a stalled Drive upload can never fill the disk and wedge the OS
  # (which is exactly what kills the VM: sshd itself stops responding).
  hard_min_free_gb: 2
  # Sweep before each download cycle: delete *.part files older than
  # this (interrupted-run leftovers, safe to drop) and old rotated logs.
  reclaim_max_age_h: 24

download:
  max_content_length_mb: 300
  min_content_length_kb: 10
  connect_timeout_s: 15
  read_timeout_s: 90
  # Async I/O-bound: workers each hold ONE domain at a time from a shared
  # queue, so effective parallelism = min(concurrency, #domains). Keep this
  # MODEST on small VMs that also run classify -- too high starves classify
  # of CPU + the SQLite write lock, so downloads pile up and fill the disk.
  # 40-64 is right for a 2-4 vCPU box; raise only on dedicated download VMs.
  concurrency: 64
  # Backlog cap: pause claiming once this many payloads sit in 'downloaded'
  # waiting for classify. Bounds tmp_downloads so the disk can NEVER fill,
  # and keeps download from outrunning classify. 0 disables. ~3000 files is
  # roughly 6-10 GB of buffer.
  max_downloaded_backlog: 3000
  # Downloads pause when free disk falls below this. 5 suits a laptop
  # (payloads are uploaded to Drive and deleted every batch); raise to
  # 20+ on a production VM with a dedicated disk.
  min_free_disk_gb: 5
  # Downloads also pause when free RAM falls below this (0 disables).
  # classify + LibreOffice conversions on a small VM can spike memory;
  # with no swap that thrashes the whole OS until sshd itself stops
  # responding. Pausing the (I/O-bound, light) downloader gives the
  # memory-hungry stages headroom instead of competing with them.
  min_free_ram_gb: 1.5
  shutdown_grace_s: 30             # SIGTERM: finish in-flight, then cancel
  db_writer_batch_size: 100        # commit every 50-200 rows
  db_writer_flush_interval_s: 2.0
  claim_batch_size: 25             # urls claimed per worker per round
  max_attempts: 4                  # per-URL attempts before dead/wayback
  wayback_fallback: true           # archived copy when origin dead/blocked
  # Consumer nodes fed by another VM's handoff: when true, only claim
  # handoff-discovered URLs while ANY are pending -- this node's own
  # harvested URLs stay on standby until the handed-off queue drains.
  # Off by default (a lone node has no handoff rows, so it's a no-op).
  handoff_first: false
  # Re-scan the registry this often and enqueue newly discovered domains
  # into the live work queue. Without this a long-running download stage
  # starves every domain harvested after it started (the stage only exits
  # when its queue drains, and the orchestrator only re-runs `download`
  # after the previous stage exits).
  domain_refresh_s: 300

politeness:
  default_delay_s: 1.5      # per-domain; robots.txt Crawl-delay always wins
  jitter_pct: 0.4
  robots_cache_ttl_hours: 24
  head_before_get: true
  # Big archives that comfortably serve faster than small org sites.
  # Matched by domain suffix; value = seconds between requests.
  domain_delay_overrides:
    # High-throughput archive/CDN infrastructure built to serve fast.
    archive.org: 0.5
    web.archive.org: 0.5
    data.commoncrawl.org: 0.5
    index.commoncrawl.org: 0.5
    zenodo.org: 1.0
    ndownloader.figshare.com: 1.0
    files.osf.io: 1.0
    # Standards bodies: moderate (large but org-run).
    3gpp.org: 1.0
    www.3gpp.org: 1.0
    ietf.org: 1.0
    www.ietf.org: 1.0
  circuit_breaker:
    backoff_stages_s: [30, 300, 1800]   # 30s -> 5min -> 30min
    park_after_consecutive_failures: 3
    park_duration_hours: 48
    blacklist_after_parks: 2
  edgar:
    requests_per_sec: 10
    user_agent_template: "PptxSweeperBot/1.0 (investor-presentation dataset research; {contact_email})"

wayback:
  cdx_base_url: "https://web.archive.org/cdx/search/cdx"
  fetch_base_url: "https://web.archive.org"
  requests_per_sec_per_worker: 3   # backs off immediately on any 429
  cdx_page_size: 1000
  retry_after_429_s: [30, 120, 300]

common_crawl:
  index_list_url: "https://index.commoncrawl.org/collinfo.json"
  num_recent_crawls: 15
  # Anonymous S3 is denied; the supported free path is HTTPS range reads
  # against data.commoncrawl.org using each crawl's cc-index-table.paths.gz
  # manifest (~300 parquet parts per crawl, only the url column is read).
  data_base_url: "https://data.commoncrawl.org"
  cdx_fallback_base: "https://index.commoncrawl.org"
  # NOTE (verified 2026-07): Common Crawl captures essentially ZERO
  # .ppt/.pptx files -- its crawler skips PowerPoint binaries -- so this
  # harvester will find very little. Wayback CDX + Tiers 2-6 are the
  # real ppt/pptx sources. (pdf added for image delivery.)
  extensions: [".pptx", ".ppt", ".pdf"]

quality:
  epsilon: 0.03
  min_slides: 5
  # pptxsweeper's OWN OCR tie-breaker (pytesseract on ambiguous images).
  # OFF by default: it's the dominant CPU cost in classify -- each ambiguous
  # image spawns a tesseract process, which starves classify, backs up the
  # download queue, and fills the disk on small VMs. With it off the quality
  # engine uses its other image signals (colour/edge/layout) and runs many
  # times faster. Set true only on a CPU-rich box that needs the extra
  # accuracy on borderline chart-vs-photo images. (Unrelated to any external
  # OCR service you may run on the same machine.)
  use_ocr: false
  ocr_ambiguous_only: true
  use_opencv: false
  high:
    min_analytical_pct: 0.50
    min_chart_diagram_pages: 3
    max_photo_heavy_pct: 0.30
  medium:
    min_analytical_pct: 0.40
    min_chart_diagram_pages: 1
  low:
    text_only_pct: 0.75
    photo_heavy_pct: 0.50
  image_signals:
    unique_color_ratio_max: 0.15
    straight_edge_ratio_min: 0.35
    uniform_bg_ratio_min: 0.25
    text_density_ambiguous_low: 0.03
    text_density_ambiguous_high: 0.15

compliance:
  blocklist_file: ./seeds/blocklist_domains.txt
  # Revised client criteria (Source Exclusion Requirements): Fortune 500
  # companies + subsidiaries, elite US universities, and prestigious US
  # research centers / national labs / think tanks are excluded unless
  # written approval exists. Same file format as the blocklist.
  excluded_sources_file: ./seeds/excluded_sources.txt
  pii_review_on_hit: true
  minors_review_on_hit: true
  prohibited_reject_on_hit: true

conversion:
  soffice_bin: soffice
  timeout_s: 120
  # Global cap on simultaneous LibreOffice conversions. Conversions run in
  # the CLASSIFY PARENT process (not worker processes), so this is a real
  # global semaphore. Each soffice needs ~300-500MB RAM: keep it at 1-2 on
  # small VMs, raise on CPU-rich boxes with many .ppt files to convert.
  max_concurrent: 2

# Image delivery (the client's new deliverable: graphical pages as PNGs).
# When delivery.image=true the pipeline extracts graphical pages from
# classified decks/PDFs (extract stage) and delivers ONE PNG per page
# instead of whole decks. Composition rules, batch folders, budgets and
# verification are unchanged -- only the delivered unit changes.
extract:
  # Render resolution (DPI). 150 keeps charts crisp at ~0.5-2MB/page.
  dpi: 150
  # Concurrent renders (soffice + pdftoppm are CPU-heavy): 2 fits a
  # 4-vCPU box that also runs classify; raise on dedicated extract VMs.
  max_concurrent: 2
  page_timeout_s: 120
  conv_timeout_s: 180
  # Perceptual near-dup threshold (Hamming distance, 0-64): pages within
  # this many bits are treated as the same image.
  phash_distance: 10
  chunk_limit: 50
  # Pause extraction when free disk falls below this (pages accumulate
  # until delivered and deleted).
  min_free_disk_gb: 2
  pdftoppm_bin: pdftoppm

delivery:
  # true = deliver extracted page PNGs (image mode); false = deliver
  # whole decks (the legacy contract). Flip per VM as the client's
  # requirements land.
  image: false
  # Cap per stream-upload cycle. Without a cap, a backlog of hundreds of
  # pages all get hardlinked into the batch dir and pushed in ONE rclone
  # copy; Google Drive's free-tier API quota throttles that copy so hard
  # it never finishes, verification fails, and nothing marks delivered.
  # A small cap keeps every cycle bounded: copy completes, sizes verify,
  # pages mark delivered, next cycle takes the next slice.
  max_files_per_cycle: 100

classify:
  review_dir_cap_gb: 20    # local review/ payloads pruned after Drive sync
  commit_every: 50
  workers: 0               # 0 = one per CPU core, then RAM-capped (see below)
  worker_memory_mb: 512    # per-worker working-set budget for the RAM cap
  chunk_limit: 150         # files per classify pass, so uploads interleave
  # Per-file compute budget (seconds) inside each classify worker: a
  # pathological payload that hangs validate/quality must become a reject,
  # never wedge the worker -- and therefore never wedge the whole deliver
  # chain (classify -> package -> Drive) the way a hung worker did.
  # 0 disables. 300s is generous for a legitimately huge deck.
  file_timeout_s: 300
  # Stall watchdog (minutes): if a classify pass makes NO progress for
  # this long while tasks are still pending, the run is wedged (a worker
  # hung inside a C extension past its SIGALRM budget -- signals are
  # deferred until the C call returns, so the per-file timeout can be
  # evaded). The wedged files are quarantined (payload deleted, row
  # rejected) and the stage force-exits so the orchestrator re-runs
  # cleanly. Progress-based, so slow-but-working runs (big decks, many
  # .ppt conversions) are never false-positived -- only total stalls trip
  # it. 0 disables.
  watchdog_stall_min: 10
  # Auto-promote manually-approved review files into delivery every N
  # hours (0 disables). Promotes BOTH quality-borderline and
  # compliance-flagged files; run `promote-review --quality-only` by hand
  # if you'd rather hold compliance-flagged ones for manual triage.
  review_auto_promote_hours: 2

filter:
  per_domain_cap: 20000
  tier_domain_caps:
    5: 500                 # universities/OCW: low acceptance expected

harvesters:
  tier1:
    # CDX APIs (Common Crawl fallback + Wayback) are domain-keyed and
    # cannot search by file extension across the whole web; they walk
    # this seed list plus every domain already in the registry.
    domain_seeds_file: ./seeds/cdx_domains.txt
  tier2:
    seed_tickers_file: ./seeds/sp1500_tickers.csv
    ir_domain_cap: 2000
  tier3:
    sitemap_domains:
      - federalreserve.gov
      - eia.gov
      - bls.gov
      - cbo.gov
      - census.gov
      - ers.usda.gov
      - cdc.gov
      - gao.gov
      - fdic.gov
      - treasury.gov
    fed_regional_banks:
      - minneapolisfed.org
      - newyorkfed.org
      - bostonfed.org
      - philadelphiafed.org
      - clevelandfed.org
      - richmondfed.org
      - atlantafed.org
      - chicagofed.org
      - stlouisfed.org
      - kansascityfed.org
      - dallasfed.org
      - frbsf.org
    osti_api_base: "https://www.osti.gov/api/v1/records"
  tier4:
    central_banks_seed: ./seeds/central_banks.csv
    generic_sources_dir: ./seeds/sources
  tier5:
    domain_cap: 500
    ocw_seed_file: ./seeds/ocw_sites.csv
  tier6:
    zenodo_api: "https://zenodo.org/api/records"
    figshare_api: "https://api.figshare.com/v2/articles/search"
    osf_api: "https://api.osf.io/v2/search/"
    ia_api: "https://archive.org/advancedsearch.php"
    github_code_search_api: "https://api.github.com/search/code"
  tier7:
    # Open-web filetype dorking via Brave Search API. Set BRAVE_API_KEY
    # in .env. Each filetype is paired with the broadening terms below to
    # push past Brave's ~200-results-per-query ceiling; extend freely.
    brave:
      api: "https://api.search.brave.com/res/v1/web/search"
      results_per_query: 20      # Brave hard max per request
      max_offset: 9              # Brave hard max -> 200 results/query
      delay_s: 1.1               # free tier ~1 req/s
      queries:
        - ""                     # bare filetype:pptx
        - "lecture"
        - "training"
        - "results presentation"
        - "annual report"
        - "conference"
        - "workshop"
        - "overview"
        - "roadmap"
        - "case study"
        - "seminar"
        - "webinar"
        - "tutorial"
        - "strategy"
        - "financial results"
        - "budget"
        - "research"
        - "guidelines"
        - "site:edu"
        - "site:gov"
        - "site:org"
        - "site:ac.uk"
        # --- expanded 2026-08-11: more broadening terms + regional
        # academic TLDs to push past the per-query result ceiling ---
        - "board meeting"
        - "investor day"
        - "earnings call"
        - "keynote"
        - "slides"
        - "deck"
        - "presentation deck"
        - "executive briefing"
        - "policy brief"
        - "project update"
        - "technical talk"
        - "graduation"
        - "course materials"
        - "exam review"
        - "department meeting"
        - "quarterly review"
        - "annual meeting"
        - "industry analysis"
        - "market outlook"
        - "economic outlook"
        - "site:ac.jp"
        - "site:ac.in"
        - "site:edu.cn"
        - "site:edu.au"
        - "site:edu.mx"
        - "site:ac.za"
        - "site:edu.br"
        - "site:edu.ph"
        - "site:ac.id"
        - "site:edu.pk"
        - "site:ac.kr"
        - "site:edu.tr"
        - "site:gob.mx"
        - "site:gov.in"
        - "site:gov.br"
    # Standards / conference bodies: browsable autoindex directory trees
    # of directly-downloadable .ppt/.pptx.
    standards:
      delay_s: 1.5
      max_dirs_per_root: 4000
      max_depth: 8
      autoindex_roots:
        - "https://www.3gpp.org/ftp/"
        - "https://www.ietf.org/proceedings/"
        - "https://docs.oasis-open.org/"
        - "https://www.open-std.org/"
        - "https://www.ieee802.org/"
    # Government / EU open-data portals running CKAN (res_format filter).
    # Portals verified live with a working /api/3/action/package_search
    # and non-empty PPT/PPTX resource counts (probed 2026-08-11); the
    # filter + downloader drop anything without ppt/pptx anyway, so a
    # portal that later goes quiet just yields nothing -- never an error.
    govdata:
      delay_s: 1.5
      rows: 100
      max_pages_per_portal: 100
      ckan_portals:
        - "https://catalog.data.gov"
        - "https://data.gov.uk"
        - "https://open.canada.ca/data/en"
        - "https://data.gov.au"
        - "https://datos.gob.es"
        - "https://data.gov.ie"
        - "https://opendata.swiss"
        - "https://www.dati.gov.it"
        - "https://data.overheid.nl"
        - "https://www.govdata.de/ckan"
        - "https://data.gov.gr"
        - "https://data.gov.sk"
        - "https://data.gov.cz"
        # --- added 2026-08-11 (each verified to answer package_search
        # with the exact res_format:(PPT OR PPTX) query used by the
        # harvester; count can be 0 today -- it still costs one request
        # per harvest pass and pays off when decks appear) ---
        - "https://data.humdata.org"        # UN OCHA HDX -- biggest single CKAN (hits!)
        - "https://data.gov.ua"             # Ukraine (hits!)
        - "https://data.gov.ro"             # Romania
        - "https://data.gov.lv"             # Latvia
        - "https://datos.gob.ar"            # Argentina
        - "https://datos.gob.cl"            # Chile
        - "https://data.gov.il"             # Israel
        - "https://podatki.gov.si"          # Slovenia (moved from data.gov.si)
        # NOT added (verified non-working 2026-08-11): data.gov.hr serves
        # HTML at the API path; data.europa.eu 307s to a 404 hub endpoint.

multi_node:
  # Work is split across machines by hash(domain) % NODE_COUNT == NODE_ID
  # (NODE_ID / NODE_COUNT come from .env). Guarantees a domain -- and
  # therefore a URL -- is only ever processed by one machine.
  # Consumer node ids (the PRODUCER's consumers). Each export run writes
  # one disjoint CSV per consumer: bucket(url) % len(consumers) == index,
  # so VM2 (node1) and VM3 (node2) never receive the same URL. Leave
  # empty for the legacy single-consumer export.
  consumer_node_ids: [1, 2]
  dedup_folder: _dedup            # on Drive, under the delivery root
  dedup_sync_interval_min: 60     # upload own hashes / import peers' hashes
  # Producer->consumer URL handoff (a download-only VM that takes a share
  # of another VM's discovered URLs instead of harvesting its own). The
  # CSV exchange goes through a FIXED top-level Drive folder (NOT under a
  # per-VM delivery root, since producer and consumer deliver to different
  # folders) so both machines see the same exchange point.
  handoff_root: PptxSweeper_Handoff
  handoff_interval_hours: 10      # producer exports / consumer imports this often
  handoff_fraction: 0.6           # share handed to the consumer
  # Batch numbers are interleaved so they are globally unique with no
  # coordination: node k of N creates batches k+1, k+1+N, k+1+2N, ...
  interleave_batch_ids: true

logging:
  level: INFO
  json_lines: true
  rotate_max_bytes: 52428800
  rotate_backup_count: 10
