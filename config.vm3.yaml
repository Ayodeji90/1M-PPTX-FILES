########################################################################
# VM3 profile overlay (4 vCPU / 16 GiB -- Azure Standard_D4ads_v7).
#
# VM3 is the SECOND CONSUMER node (node_id=2): it imports its OWN share
# of VM1's discovered URLs via the Drive handoff folder (the producer
# partitions URLs by hash so VM2 and VM3 never receive the same URL) and
# delivers to its OWN Drive account / folder. It ALSO hunts its own URLs
# from ENTIRELY DIFFERENT sources (see the harvesters.* overrides +
# seeds/cdx_domains_vm3.txt, seeds/sources_vm3/, seeds/central_banks_vm3.csv,
# seeds/global_tickers_vm3.csv), but those self-sourced URLs stay on
# STANDBY: download.handoff_first keeps the downloader on the handed-off
# queue until it drains, then it starts on VM3's own harvest.
#
# Run as:  pptxsweeper run --tiers 1,2,3,4,7 --handoff consumer
#   (tier 5 OCW belongs to VM2; tier 6 repo APIs belong to VM1. VM3 owns
#   tiers 1,2,3,4,7 with its own seed universe -- see below.)
#
# .env on VM3:  NODE_ID=2  NODE_COUNT=1   (owns 100% of ITS OWN disjoint
#   seed set; handoff CSV prefix node2_ never collides with VM2's node1_
#   or VM1's node0_).
#
# Drive: VM3 uses a SEPARATE Google Drive account for deliveries
#   (RCLONE_REMOTE=gdrive  -> its own account, RCLONE_ROOT_FOLDER=
#   PptxSweeper_Delivery_VM3). The handoff exchange still happens on the
#   SHARED account, so RCLONE_HANDOFF_REMOTE points at a second remote
#   ("shared") authenticated against VM1's account -- see cli._rclone_handoff.
#
# Loaded via `PPTXSWEEPER_OVERRIDE=config.vm3.yaml`. Only the knobs that
# differ from config.yaml are listed -- everything else inherits the
# base config.
########################################################################

download:
  concurrency: 64
  max_downloaded_backlog: 3000
  min_free_disk_gb: 10
  min_free_ram_gb: 2.5
  # CONSUMER PRIORITY: while ANY handoff-discovered URL is pending, only
  # claim handoff rows -- this node's own harvested URLs stay on standby
  # until the handed-off queue drains (see dao.claim_urls handoff_first).
  handoff_first: true

disk:
  hard_min_free_gb: 4
  reclaim_max_age_h: 24

classify:
  workers: 4               # 4 vCPU -> 4 quality-engine workers
  worker_memory_mb: 512
  chunk_limit: 100
  review_dir_cap_gb: 8
  watchdog_stall_min: 10

conversion:
  max_concurrent: 2
  timeout_s: 180

# ----------------------------------------------------------------------
# IMAGE DELIVERY (the new phase): extract graphical pages from classified
# decks/PDFs and deliver ONE PNG per page into a NEW top-level Drive
# folder on VM3's OWN account (RCLONE_IMAGE_ROOT_FOLDER=
# PptxSweeper_Image_Delivery_VM3).
# ----------------------------------------------------------------------
delivery:
  image: true
  # Pull the moved phase-1 decks (old 200GB account -> PptxSweeper_Conversion
  # on this 2TB account) into image delivery, reusing their pre-computed
  # feature vectors so no re-classify is needed.
  import_drive:
    enabled: true
    folder: PptxSweeper_Conversion
    vectors_file: data/drive_vectors.jsonl.gz
    chunk_limit: 200
    min_free_disk_gb: 6

extract:
  max_concurrent: 2
  dpi: 150
  min_free_disk_gb: 6

# ----------------------------------------------------------------------
# VM3's OWN sources -- entirely disjoint from BOTH VM1 and VM2.
# VM1 uses seeds/cdx_domains.txt + seeds/sources/ + tier3 US fed set;
# VM2 uses seeds/*_vm2.* + its tier3 US agencies. VM3's lists below
# overlap neither.
# ----------------------------------------------------------------------
harvesters:
  tier1:
    # Wayback CDX sweep of VM3's own domain universe: EU/UK/Asia-Pacific
    # universities + multilateral development banks (see the file header).
    domain_seeds_file: ./seeds/cdx_domains_vm3.txt
  tier2:
