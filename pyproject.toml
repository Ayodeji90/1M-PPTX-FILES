[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptxsweeper"
version = "0.1.0"
description = "Million-scale PPTX/PDF acquisition pipeline"
requires-python = ">=3.11"

[project.scripts]
pptxsweeper = "pptxsweeper.cli:main"

[tool.setuptools.packages.find]
include = ["pptxsweeper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
