########################################################################
# VM profile overlay (2 vCPU / 8 GiB -- e.g. Azure Standard_D2ads_v7).
#
# Loaded ON TOP of config.yaml via `PPTXSWEEPER_OVERRIDE=config.vm.yaml`
# in the VM's .env (or the systemd unit). Only the knobs that differ from
# the laptop defaults are listed -- everything else inherits config.yaml,
# so this file cannot drift out of sync with the base config.
#
# The values below are tuned for 2 vCPU / 8 GiB and are deliberately
# conservative: the downloader shares the box with classify/package, and
# a mistake here costs throughput, not data. It also runs safely on a
# 1 GiB free-tier B1s (classify's RAM cap drops workers to 1 on its own).
########################################################################

download:
  # I/O-bound, but classify needs CPU too: 32 workers is plenty on 2 vCPU
  # (each worker holds one domain at a time, so effective parallelism is
  # also bounded by the number of live domains).
  concurrency: 32
  # Smaller disk buffer on the VM: pause downloads sooner so tmp_downloads
  # can never fill a 30-64 GB boot disk. 10 not 15: with the 4 GB hard
  # floor (disk.hard_min_free_gb) plus 2 GB swap, a 10 GB floor gives
  # downloads real working room instead of oscillating pause/resume at
  # the boundary of a half-full disk.
  max_downloaded_backlog: 1500
  min_free_disk_gb: 10
  # Pause downloads early on this RAM-tight box so classify + LibreOffice
  # conversions (the memory hogs) always have headroom. The cgroup cap on
  # the service (MemoryMax=6G) is the backstop; this avoids hitting it.
  min_free_ram_gb: 2.5

disk:
  # Tighter OS-level backstop on the small 30 GB boot disk.
  hard_min_free_gb: 4
  reclaim_max_age_h: 24

classify:
  workers: 2               # 2 vCPU -> 2 quality-engine workers
  worker_memory_mb: 512    # per-worker working-set budget for the RAM cap
  chunk_limit: 100         # smaller passes so uploads interleave nicely
  # review/ payloads must FIT the 30 GB boot disk: the old 40 GB cap could
  # never trigger, so review/ grew until the disk filled and wedged the OS.
  # 8 GB keeps it bounded while still holding plenty of borderline files.
  review_dir_cap_gb: 8
  # Wedged classify runs (a worker stuck in a C extension past its SIGALRM
  # budget) must self-heal fast on this box: 10 min of zero progress =
  # quarantine the wedged files + restart. Normal runs take 2-6 min, and
  # slow-but-progressing runs never trip it (it's progress-based).
  watchdog_stall_min: 10

conversion:
  # Global LibreOffice cap (conversions run in the classify parent). Each
  # soffice needs ~0.5-1 GiB transient RAM. Set to 1 on this box: 2
  # concurrent soffice + 2 classify workers peaked at ~3.8 GiB in the
  # first minute and, combined with the 2 GiB swap, pushed the box into
  # a swap-thrash death spiral (OS freeze, sshd unreachable, cold-reboot
  # only). 1 conversion at a time keeps classify's working set well under
  # the service cgroup cap (deploy/pptxsweeper.service MemoryMax=6G).
  max_concurrent: 1
  timeout_s: 180           # a little more headroom for big legacy .ppt

# ----------------------------------------------------------------------
# IMAGE DELIVERY (the new phase): extract graphical pages from classified
# decks/PDFs and deliver ONE PNG per page into a NEW top-level Drive
# folder (RCLONE_IMAGE_ROOT_FOLDER=PptxSweeper_Image_Delivery_VM1). The
# deck pipeline keeps running for source acquisition; deliveries switch
# to images.
# ----------------------------------------------------------------------
delivery:
  image: true

extract:
  # 2 vCPU box shared with classify: keep renders serial-ish (each soffice
  # + pdftoppm pass is CPU-heavy). 1 concurrent render fits the cgroup
  # memory cap alongside classify's 2 workers + 1 conversion.
  max_concurrent: 1
  dpi: 150
  # Pages accumulate on the 30 GB boot disk until delivered+deleted;
  # pause extraction early so pages/ can never wedge the OS.
  min_free_disk_gb: 6
