# Intergovernmental / development organizations for VM3 (sitemap discovery,
# best-effort). ENTIRELY DISJOINT from VM1's seeds/sources/ (econstor,
# ageconsearch, repec, oecd_ilibrary, adb, ilo, wipo, unep, unhcr, icao,
# ebrd, fao, imo, wto, itu, videolectures, who_int, un_org, unstats, paho)
