# Intergovernmental / development organizations for VM2 (sitemap discovery,
# best-effort). ENTIRELY DISJOINT from VM1's seeds/sources/ set -- VM1
# harvests econstor, ageconsearch, repec, oecd_ilibrary, adb, ilo, wipo,
# unep, unhcr, icao, ebrd, fao, imo, wto, itu, videolectures, who_int,
# un_org, unstats, paho. None of those are repeated here.
#
# Sitemap walk is best-effort: a source whose sitemap is unreachable or
# lists no .ppt/.pptx simply yields nothing -- never an error.
